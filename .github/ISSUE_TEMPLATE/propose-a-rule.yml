name: Propose a rule
description: Suggest a rule the skills should add, change, or drop
labels: ["rule"]
body:
  - type: dropdown
    id: skill
    attributes:
      label: Which skill?
      options:
        - j2ee-best-practices (writing code)
        - j2ee-review (reviewing code)
        - j2ee-port (porting to Jakarta EE)
        - lints config
    validations:
      required: true
  - type: textarea
    id: rule
    attributes:
      label: The rule
      description: One or two sentences, phrased as guidance an agent could follow.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source
      description: A link to the published guidance this comes from (the Jakarta EE specification, the Jakarta/MicroProfile guides, the facta J2EE handbook, the Checkstyle docs, and so on).
    validations:
      required: true
  - type: textarea
    id: before
    attributes:
      label: What the agent writes today
      render: java
  - type: textarea
    id: after
    attributes:
      label: What it should write instead
      render: java
