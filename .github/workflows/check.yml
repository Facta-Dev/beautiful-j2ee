name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check-skill.py

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check-examples.py

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests -t .

  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Compile and self-check the example
        run: bash scripts/check-build.sh
      - name: Install Checkstyle
        run: |
          curl -sSL -o /tmp/checkstyle.jar https://github.com/checkstyle/checkstyle/releases/download/checkstyle-10.21.0/checkstyle-10.21.0-all.jar
          printf '#!/usr/bin/env bash\nexec java -jar /tmp/checkstyle.jar "$@"\n' | sudo tee /usr/local/bin/checkstyle >/dev/null
          sudo chmod +x /usr/local/bin/checkstyle
      - name: Prove the Checkstyle config fires
        run: bash scripts/check-lints.sh
